# Pair selection is frozen from pretraining diagnostics before downstream runs.
device: cpu
output_dir: results/experiment1
env:
  name: MultipleRooms-v0
  num_rooms: 5
  room_size: 4
  corridor_height: 1
  connector_length: 1
  max_steps: 500
  render_mode: rgb_array
  show_coordinates: false
  dense_reward: false
  goal_position: [21, 4]
  start_position: [0, 0]
occupancy:
  gamma: 0.99
  episodes: 100
  horizon: 500
  seed: 104729
matching:
  max_buffer_support_gap: 0.05
  target_buffer_support_gap: 0.02
  min_final_effective_support_gap: 0.10
  require_cross_algorithm: true
  max_pairs: 5
  fallback: deterministic_equal_size_buffer_subsampling
candidates:
  # Fill exact paths after pretraining. Strongest baseline defaults to CIC per paper coverage plots.
  - candidate_id: rover_s1_f100k
    algorithm: rover
    pretraining_seed: 1
    pretraining_frames: 100000
    checkpoint: models/discrete_states/gym/rover/1/snapshot_100000.pt
    buffer_glob: exp_local/**/appendix_multirooms_pretrain_rover_seed1/buffer/*.npz
  - candidate_id: cic_s1_f100k
    algorithm: cic
    pretraining_seed: 1
    pretraining_frames: 100000
    checkpoint: models/discrete_states/gym/cic/1/snapshot_100000.pt
    buffer_glob: exp_local/**/appendix_multirooms_pretrain_cic_seed1/buffer/*.npz
  - {candidate_id: rover_s2_f100k, algorithm: rover, pretraining_seed: 2, pretraining_frames: 100000, checkpoint: models/discrete_states/gym/rover/2/snapshot_100000.pt, buffer_glob: "exp_local/**/appendix_multirooms_pretrain_rover_seed2/buffer/*.npz"}
  - {candidate_id: rover_s3_f100k, algorithm: rover, pretraining_seed: 3, pretraining_frames: 100000, checkpoint: models/discrete_states/gym/rover/3/snapshot_100000.pt, buffer_glob: "exp_local/**/appendix_multirooms_pretrain_rover_seed3/buffer/*.npz"}
  - {candidate_id: rover_s4_f100k, algorithm: rover, pretraining_seed: 4, pretraining_frames: 100000, checkpoint: models/discrete_states/gym/rover/4/snapshot_100000.pt, buffer_glob: "exp_local/**/appendix_multirooms_pretrain_rover_seed4/buffer/*.npz"}
  - {candidate_id: rover_s5_f100k, algorithm: rover, pretraining_seed: 5, pretraining_frames: 100000, checkpoint: models/discrete_states/gym/rover/5/snapshot_100000.pt, buffer_glob: "exp_local/**/appendix_multirooms_pretrain_rover_seed5/buffer/*.npz"}
  - {candidate_id: cic_s2_f100k, algorithm: cic, pretraining_seed: 2, pretraining_frames: 100000, checkpoint: models/discrete_states/gym/cic/2/snapshot_100000.pt, buffer_glob: "exp_local/**/appendix_multirooms_pretrain_cic_seed2/buffer/*.npz"}
  - {candidate_id: cic_s3_f100k, algorithm: cic, pretraining_seed: 3, pretraining_frames: 100000, checkpoint: models/discrete_states/gym/cic/3/snapshot_100000.pt, buffer_glob: "exp_local/**/appendix_multirooms_pretrain_cic_seed3/buffer/*.npz"}
  - {candidate_id: cic_s4_f100k, algorithm: cic, pretraining_seed: 4, pretraining_frames: 100000, checkpoint: models/discrete_states/gym/cic/4/snapshot_100000.pt, buffer_glob: "exp_local/**/appendix_multirooms_pretrain_cic_seed4/buffer/*.npz"}
  - {candidate_id: cic_s5_f100k, algorithm: cic, pretraining_seed: 5, pretraining_frames: 100000, checkpoint: models/discrete_states/gym/cic/5/snapshot_100000.pt, buffer_glob: "exp_local/**/appendix_multirooms_pretrain_cic_seed5/buffer/*.npz"}
downstream:
  # Centers of rooms 1, 3, 5: near, intermediate, distant.
  goals:
    - {label: near_room_1, position: [2, 4], distance: near}
    - {label: intermediate_room_3, position: [12, 4], distance: intermediate}
    - {label: distant_room_5, position: [22, 4], distance: distant}
  seeds: [1, 2, 3, 4, 5]
analysis:
  success_threshold: 0.8
  bootstrap_samples: 10000
  bootstrap_seed: 271828
