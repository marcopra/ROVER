# @package agent
# Standard (dense) ROVER with the hyperparameters used by the NeurIPS gridworld experiments.
# Symbols refer to rover.pdf: lr_actor = PMD step size eta, lambda_reg = KRR regularisation lambda,
# sink_schedule = sink scale epsilon (Eq. 16), pmd_steps = T_PMD, discount = gamma.
_target_: agent.rover.RoverAgent
name: rover
obs_type: ???          # set from the environment by pretrain.py
obs_shape: ???
action_shape: ???
num_expl_steps: ???    # = num_seed_frames // action_repeat
discount: ${discount}
lr_actor: 10                 # PMD step size eta (initial value of the backtracking line search)
lambda_reg: 1e-3             # KRR regularisation lambda (Eq. 10)
sink_schedule: "linear(0.0, 0.05, 50_000)"   # sink scale epsilon, annealed from 0 to 0.05 over 50k steps
epsilon_schedule: 0.15       # epsilon-greedy mixing of the behaviour policy
pmd_steps: 250               # PMD iterations per actor update
pmd_eta_min: 1e-8
pmd_eta_max: 1e3
pmd_backtrack_factor: 0.25   # line-search shrink factor
pmd_backtrack_max_trials: 12
batch_size: 1024             # InfoNCE batch
batch_size_actor: 5000       # actor batch = floor(batch_size_actor / batch_size) * batch_size = 4096 transitions (KRR / PMD update)
nstep: 1
lr_encoder: 1e-3
lr_T: 1e-3
hidden_dim: 1024
feature_dim: 200
T_init_steps: 300            # encoder-only warm-up steps after the seed phase
update_every_steps: 1        # encoder update period
update_actor_every_steps: 1500
total_train_steps: ${num_train_frames}
use_tb: ${use_tb}
use_wandb: ${use_wandb}
device: ${device}
debug_plots: false           # t-SNE / occupancy diagnostic figures (slow)
